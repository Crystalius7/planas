<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self' https://planas-sync.projektai777.workers.dev; base-uri 'none'; form-action 'none'"><title>Mokymasis</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F5F7F3; --bg2:#EBEFE8; --panel:#FFFFFF; --ink:#1F2A24; --ink2:#4E5C55; --mute:#8A968F; --line:#D5DDD6;
  --acc:#2E7D5B; --acc2:#DCEDE3; --acc-ink:#1E5C42; --rose:#B4524B; --rose2:#F1DEDC; --amber:#B98A2E; --amber2:#F3E8CF;
  --blue:#3A6EA5; --blue2:#DCE6F2; --good:#2E7D5B; --bad:#B4524B; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --geo:#5F5496; --geo2:#E6E2F2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131A16; --bg2:#1B2420; --panel:#1F2A25; --ink:#E6ECE7; --ink2:#B4C0B8; --mute:#7D8A82; --line:#31403A;
  --acc:#72C69C; --acc2:#22392E; --acc-ink:#9BDDBB; --rose:#E08A83; --rose2:#3D2624; --amber:#E0B35C; --amber2:#3A3120;
  --blue:#7FA9DA; --blue2:#1F2E42; --good:#72C69C; --bad:#E08A83; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --geo:#B4A9E4; --geo2:#2A2640;
}}
:root[data-theme="dark"]{
  --bg:#131A16; --bg2:#1B2420; --panel:#1F2A25; --ink:#E6ECE7; --ink2:#B4C0B8; --mute:#7D8A82; --line:#31403A;
  --acc:#72C69C; --acc2:#22392E; --acc-ink:#9BDDBB; --rose:#E08A83; --rose2:#3D2624; --amber:#E0B35C; --amber2:#3A3120;
  --blue:#7FA9DA; --blue2:#1F2E42; --good:#72C69C; --bad:#E08A83; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --geo:#B4A9E4; --geo2:#2A2640;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem)}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.eyebrow{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc-ink);font-weight:700}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 70px}
header.top{padding:20px 0 10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
header.top .lead{color:var(--ink2);margin:.3rem 0 0;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.86rem;font-weight:600;color:var(--ink2)}
.chip.sub{border-color:transparent}
.s-biologija{background:var(--acc2);color:var(--acc-ink)}
.s-matematika{background:var(--blue2);color:var(--blue)}
.s-lietuviu{background:var(--amber2);color:var(--amber)}
.s-anglu{background:var(--rose2);color:var(--rose)}
.s-geografija{background:var(--geo2);color:var(--geo)}

/* test picker */
.picker{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.picker::-webkit-scrollbar{height:6px}
.tchip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;text-align:left;min-height:44px;color:var(--ink2)}
.tchip .sn{display:block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tchip .tt{display:block;font-weight:600;color:var(--ink)}
.tchip .rl{display:block;font-size:.78rem;color:var(--mute)}
.tchip.sel{border-color:var(--acc);background:var(--acc2);color:var(--acc-ink)}
.tchip.sel .sn,.tchip.sel .rl{color:var(--acc-ink)}
.empty{color:var(--mute);padding:20px 0}

/* selected test card */
.testcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:6px 0 14px;box-shadow:var(--shadow)}
.testmeta{color:var(--ink2);font-size:.92rem;margin:2px 0 10px}
.markrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.markbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:42px;min-height:42px;font-weight:700}
.markbtn[aria-pressed="true"]{border-color:var(--acc);background:var(--acc2);color:var(--acc-ink)}
.progline{margin:12px 0 4px;color:var(--ink2);font-size:.92rem}
.progbar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:6px 0}
.progbar i{display:block;height:100%;background:var(--acc)}
.moreneed{font-size:.86rem;color:var(--amber);margin:4px 0}
.hidedonewrap{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.hidedonewrap button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;min-height:36px}
.hidedonewrap button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc2);color:var(--acc-ink)}
.waitingmsg{color:var(--mute);padding:14px 0}

/* task list */
.tasklist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.frow{display:flex;gap:8px;align-items:flex-start}
.frow.done{opacity:.7}
.fcheck{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:1.05rem;font-weight:700;color:var(--good)}
.fcheck[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc);color:var(--acc-ink)}
.fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fbody .chip{align-self:flex-start}

.topicsbox{margin-top:18px}
.topiclinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.topiclink{min-height:42px}
.syncbadge{font-size:.78rem;color:var(--mute);white-space:nowrap}
.syncbadge.on{color:var(--acc-ink)}

/* items (from planas.template.html) */
.item[data-toggle]{cursor:pointer}
.item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:left}
.item .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .k .p{margin-left:auto;font-family:var(--serif);font-size:.95rem;color:var(--ink);letter-spacing:0;text-transform:none}
.item .t{font-weight:600}
.item .a{display:none;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.item.open .a{display:block}
.item .steps{margin:.5rem 0 0;padding-left:1.15rem}
.item .steps li{margin:.15rem 0}
.item .why{font-size:.86rem;color:var(--ink2);margin-top:6px}
.mem{margin-top:8px;font-size:.92rem}
.mem b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-ink)}
.mem .hooks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mem .ms{color:var(--ink2);font-style:italic}
.rchip{border:1px solid var(--acc);background:var(--acc2);color:var(--acc-ink);border-radius:999px;padding:2px 10px;font-size:.84rem;font-weight:600}
.hchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:.84rem}
.judge{display:flex;gap:8px;margin-top:6px}
.judge .btn{min-height:44px;min-width:44px}
.flip{position:relative;min-height:88px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px 14px;text-align:left;display:block;width:100%}
.flip .side{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}
.flip .f{font-weight:700;font-size:1.1rem;font-family:var(--serif)}
.flip .b{display:none;margin-top:6px}
.flip .b .kw{font-family:var(--serif);font-weight:700;color:var(--acc-ink);font-size:1.05rem}
.flip.on .f{opacity:.55;font-size:.95rem}
.flip.on .b{display:block}
.tile{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px 12px;width:100%;text-align:left}
.tile .v{font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--acc-ink);min-width:3ch;text-align:right;filter:blur(7px);transition:filter .2s}
.tile.on .v{filter:none}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px;text-align:left}
.opt.right{border-color:var(--good);background:var(--acc2)}
.opt.wrong{border-color:var(--bad);background:var(--rose2)}
.expl{display:none;font-size:.9rem;color:var(--ink2);margin-top:6px}
.item.answered .expl{display:block}
.mn{border-left:3px solid var(--amber);padding:6px 12px;background:var(--panel);border-radius:0 10px 10px 0}
.mn b{font-family:var(--serif);font-size:1.05rem;display:block}
.mn span{font-size:.92rem;color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:600;font-size:.92rem;min-height:40px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{border-color:var(--good);color:var(--good)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.82rem;min-height:40px;min-width:40px}
.btn:focus-visible,.item:focus-visible,.tchip:focus-visible,.flip:focus-visible,.opt:focus-visible,.roomg:focus-visible,.markbtn:focus-visible,.fcheck:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* deadlines (from planas.template.html) */
.dl{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:10px 14px 4px;margin:18px 0}
.dlh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.dlh h3{font-size:1rem}
.dl ul{list-style:none;margin:6px 0 0;padding:0}
.dl li{display:grid;grid-template-columns:14rem minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.dl .when{font-weight:700;font-variant-numeric:tabular-nums}
.dl .clk{font-family:var(--serif);font-size:1.05rem;margin-left:6px}
.dl .nt{display:block;font-weight:600;font-size:.84rem;color:var(--mute)}
.dl .ttl{font-weight:600}
.dl .sub2{display:block;font-size:.84rem;color:var(--ink2)}
.dl .it+.it{margin-top:8px}
.dl .rel{font-size:.86rem;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.dlmore{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.dlmore.collapsed ul{display:none}
.dltog{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:600;min-height:36px;color:var(--ink2)}
@media (max-width:640px){.dl li{grid-template-columns:minmax(0,1fr) auto}}

/* palace dialog (from planas.template.html) */
dialog#palace{border:none;border-radius:16px;padding:0;max-width:min(96vw,980px);width:100%;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog#palace::backdrop{background:rgba(10,20,15,.55)}
.pwrap{padding:16px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.pwrap{grid-template-columns:1fr}}
.pwrap svg{width:100%;height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.pwrap .room rect{fill:var(--bg2);stroke:var(--line);stroke-width:2;transition:fill .15s}
.pwrap .room{cursor:pointer}
.pwrap .room:hover rect{fill:var(--acc2)}
.pwrap .room.on rect{fill:var(--acc2);stroke:var(--acc);stroke-width:3}
.pwrap .room.done rect{stroke:var(--acc)}
.pwrap .room text{font-family:var(--sans);font-size:13px;fill:var(--ink);pointer-events:none}
.pwrap .room text.rn{font-family:var(--serif);font-size:17px;font-weight:700}
.pwrap .room text.ro{font-size:11.5px;fill:var(--ink2)}
.pwrap .route{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:7 6}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 0}
.stop{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:200px;background:var(--bg)}
.stop .scene{color:var(--ink2);margin:.3rem 0 .6rem}
.stop.recall .scene,.stop.recall .hk .b{display:none}
.stop .hk{border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:6px;background:var(--panel)}
.stop .hk .kw{font-family:var(--serif);font-weight:700;color:var(--acc-ink)}
.stop .hk .b{font-size:.92rem;color:var(--ink2)}
.stop.recall .hk.show .b{display:block}
.walkbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.walkbar .pos{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
.small{font-size:.85rem;color:var(--mute)}
footer{margin-top:30px;color:var(--mute);font-size:.85rem}
/* board.css - the handwritten maths board. Inlined by tools/topic.py and tools/plan.py. */
.bd,.bd-calc{--bd-paper:#FFFEF6;--bd-grid:rgba(58,108,178,.16);--bd-margin:rgba(214,64,58,.5);--bd-ink:#1C3E9C;--bd-red:#CF3328;--bd-green:#1F7A4D;
  --bd-say:#FFFFFF;--bd-line:#D5DDD6;--bd-mute:#66736C;--bd-text:#1F2A24;--bd-amber:#D69A2D;
  margin:10px 0 4px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:auto;
  font-family:"Shantell Sans","Segoe Print","Comic Sans MS",system-ui,sans-serif;color:var(--bd-text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.bd,.bd-calc){--bd-paper:#1A212E;--bd-grid:rgba(150,180,230,.12);--bd-margin:rgba(255,125,115,.42);
  --bd-ink:#A9C5FF;--bd-red:#FF8C82;--bd-green:#80D8A8;--bd-say:#1F2A25;--bd-line:#31403A;--bd-mute:#93A39A;--bd-text:#E6ECE7;--bd-amber:#E8B85F}}
:root[data-theme="dark"] :is(.bd,.bd-calc){--bd-paper:#1A212E;--bd-grid:rgba(150,180,230,.12);--bd-margin:rgba(255,125,115,.42);
  --bd-ink:#A9C5FF;--bd-red:#FF8C82;--bd-green:#80D8A8;--bd-say:#1F2A25;--bd-line:#31403A;--bd-mute:#93A39A;--bd-text:#E6ECE7;--bd-amber:#E8B85F}
.bd,.bd *,.bd *::before,.bd *::after{box-sizing:border-box}
.bd[hidden]{display:none!important}
.bd-paper{border:1px solid var(--bd-line);border-radius:6px 6px 12px 12px;overflow-x:auto;overflow-y:hidden;background:var(--bd-paper)}
.bd-sheet{position:relative;min-width:100%;width:max-content;min-height:132px;padding:14px 64px 20px 16px;background-color:var(--bd-paper);
  background-image:linear-gradient(to right,var(--bd-grid) 1px,transparent 1px),linear-gradient(to bottom,var(--bd-grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.bd-sheet::after{content:"";position:absolute;top:0;bottom:0;right:46px;border-left:2px solid var(--bd-margin);pointer-events:none}
.bd-l{position:relative;display:flex;align-items:center;white-space:nowrap;min-height:44px;padding:4px 6px;color:var(--bd-ink);
  font-family:"Caveat","Shantell Sans",cursive;font-weight:600;font-size:31px;line-height:1.08}
.bd-in{display:inline-flex;align-items:center;flex-wrap:nowrap;gap:0}
.bd-l.bd-txt{white-space:normal;font-size:25px}
.bd-l.bd-txt .bd-in{display:inline-block;max-width:34ch}
.bd-l.bd-fix{color:var(--bd-green)}
.bd-l.bd-wrong:not(.bd-bad){opacity:.38}
.bd-l.bd-fig{white-space:normal;padding:6px 6px 2px}
.bd-fig svg{display:block;width:280px;max-width:none;height:auto}
.bd-l.bd-blank{font-family:"Shantell Sans",system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--bd-mute);border:2px dashed var(--bd-grid);border-radius:8px;margin:4px 0;min-height:40px;padding:6px 10px;white-space:normal;max-width:30ch}
.bd-l.bd-click{cursor:pointer;border-radius:6px}
.bd-l.bd-click:hover{background:rgba(58,108,178,.08)}
.bd-l sup{font-size:.6em;line-height:0;position:relative;top:-.62em;margin-left:.04em}
.bd-l sub{font-size:.58em;line-height:0;position:relative;top:.3em}
.bd-fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;font-size:.84em;line-height:1.04}
.bd-fr>span{padding:0 .16em}
.bd-fr>.bd-nu{border-bottom:2px solid currentColor}
/* inside a fraction or under a root a power keeps its own line box -
   no relative lift, a real vertical-align - so it can never climb onto the bar; tools/boardcheck.py measures this on the pixels */
.bd-fr sup,.bd-rb sup{position:static;top:auto;line-height:1;vertical-align:.45em}
.bd-fr sub,.bd-rb sub{position:static;top:auto;line-height:1;vertical-align:-.25em}
.bd-fr>.bd-de{padding-top:.1em}
.bd-rt{display:inline-flex;align-items:stretch;margin:0 .05em}
.bd-rt>svg{width:.5em;flex:0 0 auto;overflow:visible}
.bd-rt>svg path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bd-ri{font-size:.5em;align-self:flex-start;margin:.1em -.28em 0 0;position:relative;z-index:1}
.bd-rb{border-top:2px solid currentColor;padding:.08em .12em 0;margin-top:.1em;display:inline-flex;align-items:center}
.bd-g{display:inline-block;width:.64em;height:.72em;margin:0 .07em;overflow:visible;vertical-align:middle}
.bd-g path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bd-id{display:inline-flex;align-items:center}
.bd-id>sup{align-self:flex-start}   /* a flex child ignores vertical-align: a power directly inside a labelled part is pinned to the top (boardcheck 2026-09-12: "64^{2/3}" sat on the baseline) */
.bd-id>sub{align-self:flex-end}
.bd-num{position:absolute;right:-52px;width:24px;text-align:center;font:700 21px/1 "Caveat",cursive;color:var(--bd-red);pointer-events:none}
.bd-ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bd-ov path{fill:none;stroke:var(--bd-red);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bd-ov path.g{stroke:var(--bd-green)}
.bd-note{position:absolute;font:700 22px/1 "Caveat",cursive;color:var(--bd-red);white-space:nowrap;pointer-events:none;transform:translateX(-50%)}
.bd-note.g{color:var(--bd-green)}
.bd-pen{position:absolute;left:0;top:0;width:30px;height:30px;pointer-events:none;opacity:0;z-index:3;color:var(--bd-ink)}
.bd-say,.bd-ask{background:var(--bd-say);border:1px solid var(--bd-line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5}
.bd-say p,.bd-ask p{margin:.3rem 0 0}
.bd-say b{color:var(--bd-ink)}
.bd-k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bd-mute);font-weight:700}
.bd-mind{border-left:3px solid var(--bd-amber);padding-left:9px}
.bd-im{font-family:"Caveat",cursive;font-weight:700;font-size:1.3em;color:var(--bd-ink);white-space:nowrap}
.bd-im sup{font-size:.62em}
.bd-o{display:block;width:100%;text-align:left;border:1px solid var(--bd-line);background:var(--bd-paper);color:var(--bd-text);border-radius:9px;padding:8px 11px;margin-top:6px;font:inherit;min-height:44px}
.bd-o.ok{border-color:var(--bd-green);box-shadow:inset 0 0 0 1.5px var(--bd-green)}
.bd-o.no{border-color:var(--bd-red);box-shadow:inset 0 0 0 1.5px var(--bd-red)}
.bd-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd-b{border:1px solid var(--bd-line);background:var(--bd-say);color:var(--bd-text);border-radius:9px;padding:7px 12px;min-height:40px;
  font-family:"Shantell Sans",system-ui,sans-serif;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer}
.bd-b.pri{background:var(--bd-ink);border-color:var(--bd-ink);color:var(--bd-paper)}
.bd-b:disabled{opacity:.45;cursor:default}

<script>/* board.js - the handwritten maths board: interactive step-by-step animations in a handwritten style, with an
   explanation in words of what was done in that step, why, and the best way to work it out mentally.
   Inlined by tools/topic.py (topic pages) and tools/plan.py (the hub). Content contract + validator: tools/topic.py.

   A board is a list of STEPS. Each step writes zero or more LINES in ink, then draws MARKS in red pen, then explains:
     {"w": "line" | ["line", ...], "marks": [["o"|"x"|"u"|"b", "<id>", "note?", "g?"]],
      "do": "Ka darau", "why": "Kodel", "mind": "Mintyse - greiciausias budas", "ask": {"q": "...", "o": ["..."], "r": 0},
      "calc": {"k": ["6","2","5","pow","3","÷","4","▶","="], "d": "125", "n": "note?"}}   (keys: tools/calc.py, verified at build)
   LINE markup: ^{..} / ^2 / ^-2 powers, _{..} indices, \f{a}{b} fraction, √{..} or √[3]{..} root, [#id ..] a part a later
   mark can circle (o), cross out (x), underline (u) or box (b); a line starting with "~" is words (wraps); "Ats." lines get
   the double underline a teacher expects. Unicode powers (x⁻²) and ∪ ∩ ∈ ∉ ∞ → ⇒ ∅ are drawn by hand (fonts lack them).

/* the strip is a STEPPER advanced by hand, one key at a time, with no timer; every key (SHIFT included) is one step. */
const CT={lt:{go:'Po vieną klavišą ▶',press:'Spausk',next:'Kitas klavišas →',again:'Iš naujo',disp:'Ekrane:',of:'iš',title:'Klavišai po vieną – tu pats spaudi „Kitas“'},
          en:{go:'One key at a time ▶',press:'Press',next:'Next key →',again:'Start again',disp:'Display:',of:'of',title:'One key at a time – you press "Next" yourself'}};
function calcHtml(c,lang){if(!c||!Array.isArray(c.k))return '';const en=lang==='en',t=CT[en?'en':'lt'];

function Sheet(root){

function whenFonts(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  return Promise.race([Promise.all([document.fonts.load('600 31px Caveat'),document.fonts.load('600 15px "Shantell Sans"')]).catch(()=>{}),new Promise(r=>setTimeout(r,1500))]);
}

/* ---------- the worked-solution player ---------- */
function mount(root,steps,opt){
  if(!root||!Array.isArray(steps)||!steps.length||root.dataset.bdOn)return;
  opt=opt||{};root.dataset.bdOn='1';root.classList.add('bd');root.innerHTML='';
  root.addEventListener('click',e=>e.stopPropagation());
  root.addEventListener('keydown',e=>e.stopPropagation());
  const n=steps.length,S=Sheet(root);
  const askEl=document.createElement('div');askEl.className='bd-ask';askEl.hidden=true;root.appendChild(askEl);
  const sayEl=document.createElement('div');sayEl.className='bd-say';sayEl.setAttribute('aria-live','polite');root.appendChild(sayEl);
  const ctl=document.createElement('div');ctl.className='bd-ctl';
  const MODES=['Žiūriu','Užbaigiu pats','Sprendžiu pats'];
  ctl.innerHTML=`<button class="bd-b" data-a="back" aria-label="Žingsnis atgal">◀</button><button class="bd-b pri" data-a="next"></button><button class="bd-b" data-a="all">Visas sprendimas ⏭</button>`+
    `<div class="bd-modes" role="group" aria-label="Kiek darai pats">${MODES.map((t,j)=>`<button class="bd-b bd-m" data-m="${j}" aria-pressed="false">${t}</button>`).join('')}</div>`;
  root.appendChild(ctl);
  const dots=document.createElement('div');dots.className='bd-dots';
  dots.innerHTML=steps.map((s,j)=>`<button class="bd-dot" data-d="${j}" aria-label="Žingsnis ${j+1}">${j+1}</button>`).join('');
  root.appendChild(dots);
  const bNext=ctl.querySelector('[data-a="next"]'),bBack=ctl.querySelector('[data-a="back"]');
  let level=Math.max(0,Math.min(2,opt.level|0)),k=0,pending=-1,run=0,revealed={},asked={};
  const hideFrom=()=>level===0?n:level===2?Math.min(1,n-1):Math.max(1,n-Math.ceil((n-1)/2));
  const mine=j=>j>=hideFrom()&&!revealed[j];

  function explain(j){
    if(j<0){sayEl.innerHTML=`<div class="bd-k">Sprendimas ranka · ${n} žingsn.</div><p>${level===2?'Pirma išspręsk visą užduotį ant lapo, tik tada tikrinkis.':level===1?'Pradžią parodysiu, paskutinius žingsnius parašysi pats.':'Spausk „Pradėti“ – sprendimas rašomas ranka po vieną žingsnį: ką darau, kodėl ir kaip greičiausiai suskaičiuoti mintyse.'}</p>`;return;}
    const s=steps[j];
    sayEl.innerHTML=`<div class="bd-k">Žingsnis ${j+1} iš ${n}</div>${s.do?`<p><b>Ką darau.</b> ${say(s.do)}</p>`:''}${s.why?`<p><b>Kodėl.</b> ${say(s.why)}</p>`:''}${s.mind?`<p class="bd-mind"><b>🧠 Mintyse.</b> ${say(s.mind)}</p>`:''}${s.calc?calcHtml(s.calc):''}`;
    wireCalc(sayEl);
  }
  function yourTurn(j){
    const s=steps[j],solo=level===2;
    const el=document.createElement('div');el.className='bd-l bd-blank';el.dataset.blank='1';
    el.textContent=solo?'✎ Tavo sprendimas – parašyk jį visą ant lapo':'✎ Tavo eilė – parašyk šį žingsnį ant lapo';
    S.lines.appendChild(el);
    sayEl.innerHTML=`<div class="bd-k">${solo?'Visa užduotis – tavo':'Žingsnis '+(j+1)+' iš '+n+' – tavo eilė'}</div><p>${solo?'Išspręsk iki atsakymo, tada spausk „Tikrinti“ ir žiūrėk, kur sutampa.':'Pirma parašyk pats, tada spausk „Tikrinti“.'}</p>`+
      (s.do&&!solo?`<p><button class="bd-b" data-hint="1">Užuomina</button></p>`:'');
    const h=sayEl.querySelector('[data-hint]');if(h)h.onclick=()=>{h.parentNode.innerHTML=`<b>Užuomina.</b> ${say(s.do)}`;};
  }
  function label(){
    dots.querySelectorAll('.bd-dot').forEach((d,j)=>{d.classList.toggle('on',j<k);d.classList.toggle('cur',j===k-1);d.classList.toggle('me',j>=hideFrom());});
    ctl.querySelectorAll('.bd-m').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===level)));
    bBack.disabled=k===0&&pending<0;bNext.disabled=false;
    if(pending>=0)bNext.textContent='Tikrinti ✓';
    else if(k===0)bNext.textContent=level===2?'Pradėti ▶':'Pradėti ▶';
    else if(k>=n)bNext.textContent='Iš naujo ⟲';
    else bNext.textContent=mine(k)?'Mano eilė ✎':'Kitas žingsnis ▶';
  }
  function drawStatic(upto){
    S.finish();run++;askEl.hidden=true;S.clear();
    for(let j=0;j<upto;j++)addLines(j);
    S.fit();
    for(let j=0;j<upto;j++){(steps[j].marks||[]).forEach(m=>S.mark(m,0,j));S.lines.querySelectorAll(`[data-step="${j}"][data-ans]`).forEach(el=>S.ansLine(el,0));}
    k=upto;
    if(pending>=0)yourTurn(pending);else explain(upto-1);
    label();
  }
  function addLines(j){
    const out=[];
    if(steps[j].svg){const f=document.createElement('div');f.className='bd-l bd-fig';f.dataset.step=j;f.innerHTML=steps[j].svg;S.lines.appendChild(f);out.push(f);}
    linesOf(steps[j]).forEach((src,li)=>{const el=lineEl(src);el.dataset.step=j;
      if(li===0){const num=document.createElement('span');num.className='bd-num';num.textContent=(j+1)+')';el.appendChild(num);}
      S.lines.appendChild(el);out.push(el);});
    return out;
  }
  async function play(j,speed){
    const my=++run;askEl.hidden=true;
    const blank=S.lines.querySelector('[data-blank]');if(blank)blank.remove();
    k=j+1;label();
    const els=addLines(j);S.fit();
    for(const el of els){await S.write(el,speed);if(my!==run)return;}
    for(const m of (steps[j].marks||[])){await S.mark(m,speed,j);if(my!==run)return;}
    for(const el of els)if(el.dataset.ans){await S.ansLine(el,speed);if(my!==run)return;}
    explain(j);label();
  }
  function ask(j){
    const q=steps[j].ask;asked[j]=true;askEl.hidden=false;
    askEl.innerHTML=`<div class="bd-k">Spėk prieš žiūrėdamas</div><p>${say(q.q||'Koks kitas žingsnis?')}</p>${q.o.map((o,i)=>`<button class="bd-o" data-o="${i}">${say(o)}</button>`).join('')}<p><button class="bd-b" data-o="skip">Praleisti</button></p>`;
    bNext.disabled=true;
    askEl.onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;
      if(b.dataset.o==='skip'){bNext.disabled=false;play(j,1);return;}
      const i=+b.dataset.o,ok=i===q.r;
      askEl.querySelectorAll('.bd-o').forEach((x,xi)=>{x.disabled=true;if(xi===q.r)x.classList.add('ok');else if(xi===i)x.classList.add('no');});
      const fb=document.createElement('p');fb.innerHTML=ok?'<b>Taip!</b> Žiūrėk, kaip tai atrodo ant lapo.':'<b>Ne visai</b> – teisingas pažymėtas žaliai. Žiūrėk, kodėl.';askEl.appendChild(fb);
      setTimeout(()=>{bNext.disabled=false;play(j,1);},ok?900:1900);};
  }
  function next(){
    if(S.busy()){S.finish();return;}
    if(pending>=0){const j=pending;pending=-1;if(level===2){for(let x=j;x<n;x++)revealed[x]=true;playFrom(j);}else{revealed[j]=true;play(j,1);}return;}
    if(k>=n){reset();return;}
    const j=k;
    if(mine(j)){pending=j;yourTurn(j);label();return;}
    if(steps[j].ask&&!asked[j]){ask(j);return;}   // any watched step predicts first (round 6)
    play(j,1);
  }
  async function playFrom(j){const my=run+1;for(let x=j;x<n;x++){await play(x,2.2);if(run!==my+(x-j))return;}}
  function reset(){pending=-1;revealed={};asked={};drawStatic(0);explain(-1);label();}
  bNext.onclick=next;
  bBack.onclick=()=>{if(pending>=0){pending=-1;drawStatic(k);return;}if(k>0){drawStatic(k-1);}};
  ctl.querySelector('[data-a="all"]').onclick=()=>{pending=-1;for(let x=0;x<n;x++)revealed[x]=true;drawStatic(n);};
  ctl.querySelectorAll('.bd-m').forEach(b=>b.onclick=()=>{level=+b.dataset.m;reset();if(opt.onLevel)opt.onLevel(level);});
  dots.onclick=e=>{const d=e.target.closest('[data-d]');if(!d)return;const j=+d.dataset.d;pending=-1;for(let x=0;x<=j;x++)revealed[x]=true;drawStatic(j+1);};
  let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(root.isConnected&&!S.busy()&&k>0)drawStatic(k);},200);});
  explain(-1);label();
  whenFonts().then(()=>{if(opt.autoplay!==false&&level<2&&k===0)play(0,1);else if(k===0&&level===2){play(0,0).then(()=>{pending=1<n?1:-1;if(pending>=0)yourTurn(1);label();});}});
}

/* ---------- "Rask klaidą": an erroneous worked example (Große & Renkl 2007) ---------- */
function mistake(root,item,opt){
  if(!root||!item||!Array.isArray(item.board)||root.dataset.bdOn)return;
  opt=opt||{};root.dataset.bdOn='1';root.classList.add('bd');root.innerHTML='';
  root.addEventListener('click',e=>e.stopPropagation());
  const S=Sheet(root);
  const sayEl=document.createElement('div');sayEl.className='bd-say';sayEl.setAttribute('aria-live','polite');root.appendChild(sayEl);
  let tries=0,done=false;
  sayEl.innerHTML=`<div class="bd-k">Rask klaidą</div><p>Vienas žingsnis neteisingas. Spausk eilutę, kurioje suklysta – turi vieną bandymą.</p>`;
  function draw(){
    S.clear();
    item.board.forEach((st,j)=>linesOf(st).forEach((src,li)=>{const el=lineEl(src);el.dataset.step=j;
      if(j>0&&!done){el.classList.add('bd-click');el.tabIndex=0;el.setAttribute('role','button');}
      if(li===0){const num=document.createElement('span');num.className='bd-num';num.textContent=(j+1)+')';el.appendChild(num);}
      S.lines.appendChild(el);}));
    S.fit();
  }
  async function reveal(ok){
    done=true;S.sheet.querySelector('.bd-notes').innerHTML='';S.lines.querySelectorAll('.bd-click').forEach(el=>{el.classList.remove('bd-click');el.removeAttribute('tabindex');el.removeAttribute('role');});
    // reviewer 2026-09-10: everything that followed from the error is wrong too - dim it, strike the bad step, and write the
    // corrected continuation in green through to its own Ats.: so the last answer on the paper is the right one
    [...S.lines.querySelectorAll('.bd-l')].filter(el=>+el.dataset.step>=item.bad).forEach(el=>{el.classList.add('bd-wrong');
      if(+el.dataset.step===item.bad){el.classList.add('bd-bad');const b=S.rel(el.querySelector('.bd-in'));S.markBox(`M${b.x-3} ${b.y+b.h*.72} Q${b.x+b.w/2} ${b.y+b.h*.5} ${b.x+b.w+3} ${b.y+b.h*.25}`,1);}});
    const fixes=(Array.isArray(item.fix)?item.fix:[item.fix]).map(src=>{const el=lineEl(src);el.classList.add('bd-fix');S.lines.appendChild(el);return el;});
    S.fit();
    sayEl.innerHTML=`<div class="bd-k">${ok?'Radai iš pirmo karto ✓':'Klaida buvo '+(item.bad+1)+' žingsnyje'}</div><p><b>Kas negerai.</b> ${say(item.e)}</p>${item.tip?`<p class="bd-mind"><b>🧠 Kaip neapsigauti.</b> ${say(item.tip)}</p>`:''}`;
    if(opt.onResult)opt.onResult(ok);
    for(const el of fixes)await S.write(el,1);
    for(const el of fixes)if(el.dataset.ans){await S.ansLine(el,1);const ov=S.sheet.querySelector('.bd-ov');if(ov.lastChild)ov.lastChild.setAttribute('class','g');}
  }
  function pick(el){
    if(done||!el)return;const j=+el.dataset.step;
    if(j===item.bad){reveal(tries===0);return;}
    tries++;el.classList.add('bd-shake');setTimeout(()=>el.classList.remove('bd-shake'),600);
    const b=S.rel(el.querySelector('.bd-in'));const t=document.createElement('div');t.className='bd-note g';t.textContent='✓ teisinga';t.style.left=(b.x+b.w+44)+'px';t.style.top=(b.y+b.h/2-11)+'px';S.sheet.querySelector('.bd-notes').appendChild(t);
    if(tries>=1)reveal(false);
    else sayEl.innerHTML=`<div class="bd-k">Rask klaidą</div><p>Ši eilutė teisinga. Patikrink kitą – skaičiuok pats, nežiūrėdamas į jau parašytą.</p>`;
  }
  S.lines.addEventListener('click',e=>pick(e.target.closest('.bd-click')));
  S.lines.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e.target.closest('.bd-click'));}});
  whenFonts().then(draw);
}

window.Board={mount,mistake,md,calcHtml,playCalc,wireCalc};
})();
</script>
<script>
(function(){
const EMBED = /*__FOCUS__*/null;

function boot(data){
  if(!data){document.getElementById('built').textContent='Duomenų nėra.';return;}
  const U=data.units||{}, TOPICS=data.topics||{}, DL=(data.deadlines||[]).slice();
  const SCALE=data.scale||{};
  const TESTS=(data.tests||[]);
  const byId={}; TESTS.forEach(t=>byId[t.id]=t);
  const DEFAULT_MARK=String(data.defaultMark||'8');
  const SUBJ={biologija:'Biologija',matematika:'Matematika',lietuviu:'Lietuvių',anglu:'Anglų',geografija:'Geografija'};

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SAFE_TAGS_REMOVE=['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','STYLE','BASE','FORM','FOREIGNOBJECT'];
  function sanitize(html){
    try{
      const doc=new DOMParser().parseFromString('<div id="root">'+String(html==null?'':html)+'</div>','text/html');
      const root=doc.body&&doc.body.firstChild;
      if(!root)return '';
      root.querySelectorAll('*').forEach(el=>{
        if(SAFE_TAGS_REMOVE.indexOf(el.tagName.toUpperCase())!==-1)el.remove();
      });
      root.querySelectorAll('*').forEach(el=>{
        Array.prototype.slice.call(el.attributes).forEach(attr=>{
          const name=attr.name.toLowerCase();
          if(name.indexOf('on')===0){el.removeAttribute(attr.name);return;}
          if(name==='href'||name==='src'||name==='xlink:href'){
            const v=(attr.value||'').trim().toLowerCase();
            if(v.indexOf('#')!==0&&v.indexOf('data:image/')!==0)el.removeAttribute(attr.name);
          }
        });
      });
      return root.innerHTML;
    }catch(e){return '';}
  }
  // ---------- board XSS hardening: board.js writes board step text, step.svg, u.e, u.tip and mistake
  // explanations straight into innerHTML, so nothing of a unit's board data may reach Board.mount /
  // Board.mistake / Board.calcHtml unsanitized. Deep-clean every string in it (recursively) through the
  // sanitize() above and cache the cleaned copy per unit id. ----------
  const _boardSanCache=new Map();
  function sanDeep(val){
    if(typeof val==='string')return sanitize(val);
    if(Array.isArray(val))return val.map(sanDeep);
    if(val&&typeof val==='object'){
      const out={};
      for(const k in val){if(Object.prototype.hasOwnProperty.call(val,k))out[k]=sanDeep(val[k]);}
      return out;
    }
    return val;
  }
  function sanUnitBoard(u){
    if(!u)return {board:null,calc:null,bad:undefined,fix:null,e:'',tip:''};
    if(_boardSanCache.has(u.id))return _boardSanCache.get(u.id);
    const clean={
      board:u.board?sanDeep(u.board):null,
      calc:u.calc?sanDeep(u.calc):null,
      bad:u.bad,
      fix:u.fix!=null?sanDeep(u.fix):u.fix,
      e:u.e!=null?sanitize(u.e):u.e,
      tip:u.tip!=null?sanitize(u.tip):u.tip
    };
    _boardSanCache.set(u.id,clean);
    return clean;
  }
  const pad=n=>String(n).padStart(2,'0');
  const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  const TODAY=todayISO();
  const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
  const LT_M=['sausio','vasario','kovo','balandžio','gegužės','birželio','liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];
  const LT_DS=['Sk','Pr','An','Tr','Kt','Pn','Št'];
  const fmtDue=iso=>{const d=new Date(iso+'T12:00:00');return LT_M[d.getMonth()]+' '+d.getDate()+' d. ('+LT_DS[d.getDay()]+')';};
  const relDays=dateStr=>{const n=dayDiff(TODAY,dateStr);if(n===0)return 'šiandien';if(n===1)return 'rytoj';if(n<0)return 'praėjo';return 'po '+n+' d.';};

  // ---------- progress: PLANAS_STORE (site) or localStorage/sessionStorage only (PC) ----------
  const KEY='planas.focus.v1';
  const STORE=(window.PLANAS_EPHEMERAL===true)?sessionStorage:localStorage;
  function newerVal(a,b){return Math.abs(b||0)>Math.abs(a||0)?(b||0):(a||0);}
  function mergeDoneMap(a,b){const out={};for(const k of new Set([...Object.keys(a||{}),...Object.keys(b||{})]))out[k]=newerVal((a||{})[k],(b||{})[k]);return out;}
  function mergeRecMap(a,b){const out=Object.assign({},a||{});for(const k in (b||{})){const x=out[k]||{ok:0,bad:0,last:0,lastOk:false};const y=b[k]||{};out[k]={ok:Math.max(x.ok||0,y.ok||0),bad:Math.max(x.bad||0,y.bad||0),last:Math.max(x.last||0,y.last||0),lastOk:(y.last||0)>=(x.last||0)?!!y.lastOk:!!x.lastOk};}return out;}
  function mergeTargetsMap(a,b){const out=Object.assign({},a||{});for(const k in (b||{})){const x=out[k],y=b[k];if(!x||(y&&(y.at||0)>(x.at||0)))out[k]=y;}return out;}
  function mergeAll(a,b){if(!b)return a;return {v:1,done:mergeDoneMap(a.done,b.done),rec:mergeRecMap(a.rec,b.rec),targets:mergeTargetsMap(a.targets,b.targets),updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0)};}

  let P={v:1,done:{},rec:{},targets:{},updatedAt:0};
  try{const raw=STORE.getItem(KEY);if(raw)P=mergeAll(P,JSON.parse(raw));}catch(e){}
  function keepLocal(){try{STORE.setItem(KEY,JSON.stringify(P));}catch(e){}}
  function save(){P.updatedAt=Date.now();keepLocal();if(window.PLANAS_STORE)window.PLANAS_STORE.save(P);render();}

  let selTest=TESTS.length?TESTS[0].id:null;
  try{const s=STORE.getItem('planas.focus.sel');if(s&&byId[s])selTest=s;}catch(e){}
  let hideDone=false;
  try{hideDone=STORE.getItem('planas.focus.hidedone')==='1';}catch(e){}
  let dlOpen=false;

  // ---------- item rendering (copied and adapted from planas.template.html) ----------
  const subjChip=s=>`<span class="chip sub s-${esc(s)}">${esc(SUBJ[s]||s)}</span>`;
  function roomChip(topic,r){const t=TOPICS[topic];const n=t&&t.rooms&&t.rooms[r]?t.rooms[r].n.split(' = ')[0]:('Kambarys '+(r+1));return `<button class="rchip" data-room="${esc(r)}" data-topic="${esc(topic)}">🚪 ${esc(n)}</button>`;}
  function hookChip(topic,kw){const t=TOPICS[topic];let term='';if(t&&t.rooms)for(const r of t.rooms)for(const h of (r.hooks||[]))if(h[1]===kw)term=h[0];return `<span class="hchip">${esc(kw)}${term?' → '+esc(term):''}</span>`;}
  function memBlock(u){if(!u.rooms&&!u.hooks&&!u.s)return '';return `<div class="mem"><b>${tr(u,'Kaip įsiminti')}</b><div class="hooks">${(u.rooms||[]).map(r=>roomChip(u.topic,r)).join('')}${(u.hooks||[]).map(h=>hookChip(u.topic,h)).join('')}</div>${u.s?`<div class="ms">${esc(u.s)}</div>`:''}</div>`;}
  const EN={'Nemoku':'Not yet','Moku':'I know','Pirma išspręsk pats, tada spausk ir pasitikrink':'Do it yourself first, then press and check','Atverti lentą ✍️':'Open the board ✍️','Užuomina: ':'Hint: ','Pirma atsakyk mintyse, tada spausk':'Answer in your head first, then press','Kodėl tikėtina: ':'Why likely: ','Prisimink atsakymą, tada pasitikrink':'Recall the answer, then check','Terminas':'Term','Kas tai?':'What is it?','Kortelė':'Card','Įrašyk atsakymą mintyse, tada spausk':'Fill in the answer in your head, then press','Kaip įsiminti':'How to remember','Moku ✓':'I know ✓'};
  function tr(u,s){return (u&&u.lang==='en'&&EN[s])||s;}
  function judge(uid,u){u=u||U[uid];return `<div class="judge"><button class="btn sm no" data-j="bad" data-u="${esc(uid)}">${tr(u,'Nemoku')}</button><button class="btn sm ok" data-j="ok" data-u="${esc(uid)}">${tr(u,'Moku')}</button></div>`;}
  function calcItem(u,lab){const en=u.lang==='en';const strip=(window.Board&&Board.calcHtml)?Board.calcHtml(sanUnitBoard(u).calc,u.lang):`<div class="small">${esc(u.a)}</div>`;
    return `<div class="item q" data-toggle="1" role="button" tabindex="0">${lab}<div class="k"><span>🔢 ${en?'Calculator drill':'Skaičiuotuvo treniruotė'}</span></div><div class="t">${esc(u.q)}</div><div class="small">${en?'Take your calculator, get the answer yourself, then press and compare the keys':'Paimk skaičiuotuvą, gauk atsakymą pats, tada spausk ir palygink klavišus'}</div><div class="a">${sanitize(strip)}${u.n?`<div class="small">${esc(u.n)}</div>`:''}${judge(u.id,u)}</div></div>`;}
  function steps(u){return (u.steps&&u.steps.length)?`<ol class="steps">${u.steps.map(x=>`<li>${sanitize(x)}</li>`).join('')}</ol>`:'';}
  function ab(u,mode){return (u.board&&window.Board)?`${board(u,mode)}<details class="asum"><summary>Santrauka – atsakymas žodžiais</summary>${sanitize(u.a)}</details>`:`${sanitize(u.a)}${steps(u)}`;}
  function board(u,mode){return (u.board&&window.Board)?`<div class="bdh" data-bd="${esc(u.id)}" data-mode="${esc(mode)}"></div>`:steps(u);}
  function qr(u){const rec=P.rec[u.id]||{},n=(u.o||[]).length,k=(u.kind==='rule'&&n)?((rec.ok||0)+(rec.bad||0))%n:0,ord=[...Array(n).keys()].map(j=>(j+k)%n);return {o:ord.map(j=>u.o[j]),r:ord.indexOf(u.r)};}
  function levelFor(u,mode){if(mode==='new'||u.type==='practice')return 0;const r=P.rec[u.id];if(!r)return 0;return 0;}
  function mountIn(el){if(!el)return;const bb=el.querySelector(':scope > button.btn.sm[aria-expanded]');if(bb){const op=el.classList.contains('open');bb.setAttribute('aria-expanded',String(op));bb.textContent=op?'Užverti ✕':'Atverti lentą ✍️';}if(!window.Board||!el.classList.contains('open'))return;el.querySelectorAll('[data-bd]:not([data-bd-on])').forEach(b=>{const u=U[b.dataset.bd];if(!u)return;const sc=sanUnitBoard(u);if(sc.board)Board.mount(b,sc.board,{level:levelFor(u,b.dataset.mode)});});}
  // ---------- persist + patch only what changed (checkbox, progress line, counters) so an open quiz's marked
  // options/explanation and an open board's mistake explanation are never wiped by a full re-render ----------
  function saveProgress(){P.updatedAt=Date.now();keepLocal();if(window.PLANAS_STORE)window.PLANAS_STORE.save(P);}
  function patchCheckbox(uid){
    const row=document.querySelector('[data-frow="'+String(uid).replace(/"/g,'\\"')+'"]');
    if(!row)return;
    const done=isDone(uid);
    row.classList.toggle('done',done);
    const btn=row.querySelector('[data-check]');
    if(btn){btn.setAttribute('aria-pressed',String(done));btn.textContent=done?'✓':'';}
  }
  function patchProgress(){
    const test=byId[selTest];
    if(!test||test.waiting||!test.order||!test.order.length)return;
    const mark=getMark(test.id);
    const ids=shown(test,mark);
    const doneCount=ids.filter(isDone).length;
    const total=ids.length;
    const pct=total?Math.round(doneCount/total*100):0;
    const higherMark=String(Number(mark)+1);
    const K=(Number(mark)<10)?(shown(test,higherMark).length-total):0;
    const box=document.getElementById('testcard');
    if(!box)return;
    const pl=box.querySelector('.progline');
    if(pl)pl.textContent='Pažymiui '+mark+': '+doneCount+' iš '+total+' užduočių padaryta';
    const bar=box.querySelector('.progbar i');
    if(bar)bar.style.width=pct+'%';
    let mn=box.querySelector('.moreneed');
    if(K>0){
      if(!mn){mn=document.createElement('div');mn.className='moreneed';const pb=box.querySelector('.progbar');if(pb&&pb.parentNode)pb.insertAdjacentElement('afterend',mn);}
      mn.textContent='Aukštesniam pažymiui dar +'+K+' užduočių';
    } else if(mn){mn.remove();}
  }
  function afterAnswer(uid){saveProgress();patchCheckbox(uid);patchProgress();renderHeader();}
  function recUnit(uid,ok){const r=P.rec[uid]||{ok:0,bad:0,last:0,lastOk:false};if(ok){r.ok++;r.lastOk=true;}else{r.bad++;r.lastOk=false;}r.last=Date.now();P.rec[uid]=r;P.done[uid]=ok?Date.now():-Date.now();afterAnswer(uid);}
  function mountMistakes(){if(!window.Board)return;document.querySelectorAll('[data-mk]:not([data-bd-on])').forEach(el=>{const u=U[el.dataset.mk];if(!u)return;
    const sc=sanUnitBoard(u);
    Board.mistake(el,{board:sc.board,bad:sc.bad,fix:sc.fix,e:sc.e,tip:sc.tip},{onResult:ok=>{recUnit(u.id,ok);}});});}
  function label(mode,u){const L=(u&&u.lang==='en')?{new:'New'}:{new:'Užduotis'};return L[mode]||mode;}

  function renderItem(it,mode){
    const u=U[it.u]; if(!u)return '';
    const lab=`<span data-uid="${esc(u.id)}" hidden></span><div class="k"><span>${label(mode,u)}</span>${u.type==='question'?`<span class="p" title="${u.lang==='en'?'Probability estimate from the material, not a measured frequency':'Tikimybės įvertis pagal medžiagą, ne išmatuotas dažnis'}">~${Math.round((u.w||0)*100)} % <small>${u.lang==='en'?'estimate':'įvertis'}</small></span>`:''}${u.c==='calc'?'<span title="Skaičiuotuvas daro aritmetiką">🔢 skaičiuotuvas daro</span>':u.c==='head'?'<span title="Skaičiuotuvas nepadės">🧠 reikia galvos</span>':u.c==='both'?'<span>🧠 + 🔢</span>':''}</div>`;
    if(u.kind==='calc'&&u.calc)return calcItem(u,lab);
    if(u.type==='practice'){
      return `<div class="item q" data-toggle="1" ${u.board&&window.Board?'':'role="button" tabindex="0"'}>${lab}${u.t?`<div class="small">${esc(u.t)}</div>`:''}<div class="t">${esc(u.q)}</div><div class="small">${tr(u,'Pirma išspręsk pats, tada spausk ir pasitikrink')}</div>${u.board&&window.Board?`<button class="btn sm" type="button" aria-expanded="false">${tr(u,'Atverti lentą ✍️')}</button>`:''}<div class="a">${ab(u,mode)}${u.hint?`<div class="small">${tr(u,'Užuomina: ')}${esc(u.hint)}</div>`:''}${judge(u.id)}</div></div>`;
    }
    if(u.type==='question'){
      return `<div class="item q" data-toggle="1" ${u.board&&window.Board?'':'role="button" tabindex="0"'}>${lab}<div class="t">${esc(u.q)}</div><div class="small">${tr(u,'Pirma atsakyk mintyse, tada spausk')}</div>${u.board&&window.Board?`<button class="btn sm" type="button" aria-expanded="false">${tr(u,'Atverti lentą ✍️')}</button>`:''}<div class="a">${ab(u,mode)}${u.why?`<div class="why">${tr(u,'Kodėl tikėtina: ')}${esc(u.why)}</div>`:''}${memBlock(u)}${judge(u.id)}</div></div>`;
    }
    if(u.type==='hook'){
      const room=TOPICS[u.topic]&&TOPICS[u.topic].rooms&&TOPICS[u.topic].rooms[u.room]?TOPICS[u.topic].rooms[u.room].n.split(' = ')[0]:'';
      return `<div class="item">${lab}<button class="flip" data-flip="1"><span class="side">${tr(u,'Terminas')} · 🚪 ${esc(room)}</span><div class="f">${esc(u.term)}</div><div class="b"><div class="kw">${esc(u.kw)}</div><div>${esc(u.img)}</div></div></button>${judge(u.id)}</div>`;
    }
    if(u.type==='number'){
      return `<div class="item">${lab}<button class="tile" data-tile="1"><span>${esc(u.label)}</span><span class="v">${esc(u.value)}</span></button>${judge(u.id)}</div>`;
    }
    if(u.type==='card'){
      return `<div class="item">${lab}<button class="flip" data-flip="1"><span class="side">${tr(u,'Kortelė')}</span><div class="f">${esc(u.q)}</div><div class="b">${sanitize(u.a)}</div></button>${judge(u.id)}</div>`;
    }
    if(u.type==='quiz'){
      if(u.kind==='error'&&!window.Board)return `<div class="item q" data-toggle="1" role="button" tabindex="0">${lab}<div class="t">🔍 ${esc(u.s)}</div><div class="small">Klaidingo sprendimo parodyti nepavyko – spausk ir perskaityk tipinę klaidą</div><div class="a">${esc(u.e)}${u.tip?`<div class="small">${esc(u.tip)}</div>`:''}${judge(u.id)}</div></div>`;
      if(u.kind==='error')return `<div class="item">${lab}<div class="k"><span>🔍 Rask klaidą${u.t?' · '+esc(u.t):''}</span></div><div class="t">${esc(u.s)}</div><div data-mk="${esc(u.id)}"></div></div>`;
      if(!u.o||!u.o.length)return `<div class="item q" data-toggle="1" ${u.board&&window.Board?'':'role="button" tabindex="0"'}>${lab}<div class="t">${esc(u.s)}</div><div class="small">${tr(u,'Įrašyk atsakymą mintyse, tada spausk')}</div><div class="a">${esc(u.e)}${judge(u.id)}</div></div>`;
      return `<div class="item quiz" data-r="${qr(u).r}" data-u="${esc(u.id)}">${lab}${u.kind==='rule'?'<div class="k"><span>🧭 Kurią taisyklę taikysi?</span></div>':''}<div class="t">${esc(u.kind==='rule'?u.s.replace(/^Kurią taisyklę taikysi\? /,''):u.s)}</div><div class="opts">${qr(u).o.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div><div class="expl">${esc(u.e)}</div></div>`;
    }
    if(u.type==='vbe'){
      return `<div class="item vbe" data-toggle="1" ${u.board&&window.Board?'':'role="button" tabindex="0"'}>${lab}<div class="k"><span>VBE ${esc(u.year)}${u.session&&u.session!=='pagrindinė'?' ('+esc(u.session)+')':''} · ${esc(u.number)} · ${esc(u.points)} t. · ${esc(u.form)}</span></div><div class="t" style="white-space:pre-line">${esc(u.question)}</div><div class="small">Atsakyk raštu ar mintyse, tada tikrink pagal vertinimo instrukciją</div><div class="a"><b>Atsakymas:</b> <span style="white-space:pre-line">${esc(u.answer)}</span><div class="small">Šaltinis: ${esc(u.source)}</div>${judge(u.id)}</div></div>`;
    }
    if(u.type==='mnemonic'){return `<div class="mn"><b>${esc(u.b)}</b><span>${esc(u.s)}</span></div>`;}
    return '';
  }

  function taskText(u){return u.q||u.term||u.s||u.label||u.question||u.title||'';}
  function isDone(uid){return (P.done[uid]||0)>0;}
  function setDone(uid,val,noSave){P.done[uid]=val?Date.now():-Date.now();if(!noSave)save();}

  function need(mark){return SCALE[String(mark)];}
  function shown(test,mark){
    if(test.waiting||!test.order||!test.order.length)return [];
    const n=need(mark);const cum=test.cum||[];
    if(n>=1.0)return test.order.slice();
    let k=cum.findIndex(c=>c>=n-1e-9);
    if(k<0)k=cum.length-1;
    return test.order.slice(0,k+1);
  }
  function getMark(testId){const t=P.targets[testId];return (t&&t.mark)||DEFAULT_MARK;}
  function setMark(testId,mark){P.targets[testId]={mark:String(mark),at:Date.now()};save();}

  // ---------- palace ----------
  const dlg=document.getElementById('palace');let pTopic=null,rIdx=0,recall=false;
  function openPalace(topic,r){const t=TOPICS[topic];if(!t||!t.palaceSvg)return;pTopic=topic;document.getElementById('ptitle').textContent=(t.title||'')+' – kelias per tavo butą';document.getElementById('psvg').innerHTML=sanitize(t.palaceSvg);
    document.querySelectorAll('#psvg .room').forEach(g=>{g.classList.add('roomg');g.onclick=()=>room(+g.dataset.r);g.onkeydown=e=>{if(e.key==='Enter')room(+g.dataset.r);};});
    room(r||0);if(!dlg.open)dlg.showModal();}
  function room(i){const t=TOPICS[pTopic];rIdx=i;document.querySelectorAll('#psvg .room').forEach((g,j)=>{g.classList.toggle('on',j===i);g.classList.toggle('done',j<i);});const r=t&&t.rooms&&t.rooms[i];if(!r)return;
    const st=document.getElementById('stop');st.classList.toggle('recall',recall);
    st.innerHTML=`<div class="eyebrow">Kambarys ${i+1} / ${t.rooms.length}</div><h3>${esc(r.n)}</h3><p class="scene">${esc(r.scene)}</p>${recall?'<p class="small">Prisimink, kas čia vyksta ir kokie žodžiai-kabliukai. Spausk terminą, kad pasitikrintum.</p>':''}${(r.hooks||[]).map(h=>`<div class="hk" tabindex="0"><span class="kw">${esc(h[0])}</span> — <span class="b"><b>${esc(h[1])}</b> · ${esc(h[2])}</span></div>`).join('')}`;
    st.querySelectorAll('.hk').forEach(el=>{el.onclick=()=>el.classList.toggle('show');});
    document.getElementById('walkPos').textContent=(i+1)+' / '+t.rooms.length;}
  document.getElementById('walkNext').onclick=()=>{const t=TOPICS[pTopic];if(t)room((rIdx+1)%t.rooms.length);};
  document.getElementById('walkMode').onclick=e=>{recall=!recall;e.target.textContent=recall?'Rodyti viską':'Iš atminties';room(rIdx);};
  document.getElementById('walkReset').onclick=()=>room(0);
  document.getElementById('pclose').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});

  // ---------- deadlines (adapted from planas.template.html) ----------
  const KINDL={test:'Mokykloje',exam:'Valstybinis egzaminas',assign:'Moodle darbas',quiz:'Moodle testas','online-test':'Moodle testas namuose, laikas ribotas'};
  function dlItem(x){
    const kind=KINDL[x.kind]||'Terminas';
    return `<div class="it">${x.subjectName?`<span class="chip sub">${esc(x.subjectName)}</span> `:''}<span class="ttl">${esc(x.title)}</span><span class="sub2">${esc(kind)}</span></div>`;
  }
  function dlGroup(g){
    const x=g[0], rel=relDays(x.date);
    const clock=x.time?`<span class="clk">${esc(x.time)}</span>`:`<span class="nt">laikas dar nepaskelbtas</span>`;
    return `<li><span class="when">${fmtDue(x.date)}${clock}</span><span class="what">${g.map(dlItem).join('')}</span><span class="rel">${esc(rel)}</span></li>`;
  }
  function dlGroups(rows){
    const groups=[];rows.forEach(x=>{const k=x.date+'|'+(x.time||''),g=groups[groups.length-1];if(g&&g.k===k)g.push(x);else{const ng=[x];ng.k=k;groups.push(ng);}});
    return groups;
  }
  function renderDeadlines(){
    const box=document.getElementById('dl');
    if(!DL.length){box.innerHTML='';box.className='dl';return;}
    // the next 14 days always show; only later deadlines are collapsible, with their own toggle
    const soon=DL.filter(x=>dayDiff(TODAY,x.date)<=14);
    const rest=DL.filter(x=>dayDiff(TODAY,x.date)>14);
    box.className='dl';
    box.innerHTML=`<div class="dlh"><h3>Terminai</h3><span class="small">artimiausi, su valanda</span></div>`+
      (soon.length?`<ul>${dlGroups(soon).map(dlGroup).join('')}</ul>`:'<p class="small">Artimiausių terminų nėra.</p>')+
      (rest.length?`<div class="dlmore${dlOpen?'':' collapsed'}"><button class="dltog" type="button" aria-expanded="${dlOpen}">${dlOpen?'Suskleisti':'Rodyti vėlesnius ('+rest.length+')'}</button>${dlOpen?`<ul>${dlGroups(rest).map(dlGroup).join('')}</ul>`:''}</div>`:'');
  }

  // ---------- header ----------
  function syncStatusText(){
    if(window.PLANAS_STORE){
      const s=window.PLANAS_STORE.status();
      if(s==='saved')return {t:'☁ sinchronizuota',on:true};
      if(s==='saving')return {t:'☁ siunčiama…',on:false};
      if(s==='offline'||s==='error')return {t:'⚠ neišsaugota debesyje',on:false};
      return {t:'išsaugota šiame įrenginyje',on:false};
    }
    return {t:'išsaugota šiame įrenginyje',on:false};
  }
  function renderHeader(){
    const built=data.generatedAt?String(data.generatedAt).replace('T',' '):'';
    document.getElementById('built').textContent=built?('sukurta '+built):'';
    const s=syncStatusText();
    const el=document.getElementById('syncbadge');el.textContent=s.t;el.classList.toggle('on',s.on);
  }

  // ---------- picker ----------
  function tchipHtml(t){
    const days=t.date?relDays(t.date)+(t.time?' · '+t.time:''):'data dar nepaskelbta';
    return `<button class="tchip${t.id===selTest?' sel':''}" role="tab" aria-selected="${t.id===selTest}" data-testsel="${esc(t.id)}"><span class="sn">${esc(t.subjectName||t.subject||'')}</span><span class="tt">${esc(t.title||'')}</span><span class="rl">${esc(days)}</span></button>`;
  }
  function renderPicker(){
    const box=document.getElementById('picker');
    if(!TESTS.length){box.innerHTML='';return;}
    box.innerHTML=TESTS.map(tchipHtml).join('');
  }

  // ---------- selected test card ----------
  const KIND_LABEL={'online-test':'Moodle testas namuose','test':'Mokykloje','exam':'Egzaminas'};
  function taskRow(uid){
    const u=U[uid];if(!u)return '';
    const done=isDone(uid);
    if(hideDone&&done)return '';
    return `<div class="frow${done?' done':''}" data-frow="${esc(uid)}"><button class="fcheck" type="button" data-check="${esc(uid)}" aria-pressed="${done}" aria-label="Pažymėti atlikta">${done?'✓':''}</button><div class="fbody">${subjChip(u.subject)}${renderItem({u:uid},'new')}</div></div>`;
  }
  function renderTestCard(){
    const box=document.getElementById('testcard');
    const topicsBox=document.getElementById('foot');
    if(!TESTS.length){box.innerHTML='<p class="empty">Artimiausių testų nėra.</p>';renderDeadlines();return;}
    const test=byId[selTest]||TESTS[0];selTest=test.id;
    try{STORE.setItem('planas.focus.sel',selTest);}catch(e){}
    const mark=getMark(test.id);
    const kindLabel=KIND_LABEL[test.kind]||test.kind||'';
    let markRow='';
    for(let m=4;m<=10;m++){markRow+=`<button class="markbtn" type="button" data-mark="${esc(m)}" data-test="${esc(test.id)}" aria-pressed="${String(m)===String(mark)?'true':'false'}">${m}</button>`;}
    let body='';
    if(test.waiting||!test.order||!test.order.length){
      body=`<div class="waitingmsg">Mokytoja dar neįkėlė medžiagos šiam testui.</div>`;
    } else {
      const ids=shown(test,mark);
      const doneCount=ids.filter(isDone).length;
      const total=ids.length;
      const pct=total?Math.round(doneCount/total*100):0;
      const higherMark=String(Number(mark)+1);
      const K=(Number(mark)<10)?(shown(test,higherMark).length-total):0;
      body=`<div class="progline">Pažymiui ${esc(mark)}: ${doneCount} iš ${total} užduočių padaryta</div>
        <div class="progbar"><i style="width:${pct}%"></i></div>
        ${K>0?`<div class="moreneed">Aukštesniam pažymiui dar +${K} užduočių</div>`:''}
        <div class="hidedonewrap"><button type="button" data-hidedone="1" aria-pressed="${hideDone}">${hideDone?'Rodyti padarytas':'Slėpti padarytas'}</button></div>
        <div class="tasklist">${ids.map(taskRow).join('')}</div>`;
    }
    const topicLinks=(test.topics||[]).map(id=>{
      const t=TOPICS[id];if(!t)return '';
      return `<button class="btn topiclink" type="button" data-opentopic="${esc(id)}">📄 ${esc(t.title||id)}</button>`;
    }).join('');
    box.innerHTML=`<div class="testcard">
      <h2>${esc(test.title||'')}</h2>
      <div class="testmeta">${test.date?esc(test.date)+(test.time?' · '+esc(test.time):''):'Tikslios datos dar nėra'} · ${esc(kindLabel)}</div>
      <div class="markrow">${markRow}</div>
      ${body}
      ${topicLinks?`<div class="topicsbox"><h2>Temos puslapiai</h2><div class="topiclinks">${topicLinks}</div></div>`:''}
    </div>`;
    renderDeadlines();
  }

  function render(){renderHeader();renderPicker();renderTestCard();}

  // ---------- events (one delegated click listener) ----------
  document.addEventListener('click',e=>{
    const rc=e.target.closest('.rchip');if(rc){e.preventDefault();e.stopPropagation();openPalace(rc.dataset.topic,+rc.dataset.room);return;}
    const j=e.target.closest('[data-j]');if(j){e.stopPropagation();const uid=j.dataset.u;recUnit(uid,j.dataset.j==='ok');return;}
    const opt=e.target.closest('.opt');if(opt){const q=opt.closest('.quiz');if(q.classList.contains('answered'))return;q.classList.add('answered');const r=+q.dataset.r;const right=+opt.dataset.opt===r;q.querySelectorAll('.opt').forEach((o,i)=>{if(i===r)o.classList.add('right');else if(o===opt)o.classList.add('wrong');});const uid=q.dataset.u;if(uid)recUnit(uid,right);return;}
    const fl=e.target.closest('.flip');if(fl){fl.classList.toggle('on');return;}
    const tl=e.target.closest('.tile');if(tl){tl.classList.toggle('on');return;}
    const chk=e.target.closest('[data-check]');if(chk){e.stopPropagation();const uid=chk.dataset.check;setDone(uid,!isDone(uid));return;}
    const mk=e.target.closest('[data-mark]');if(mk){setMark(mk.dataset.test,mk.dataset.mark);return;}
    const ts=e.target.closest('[data-testsel]');if(ts){selTest=ts.dataset.testsel;try{STORE.setItem('planas.focus.sel',selTest);}catch(e2){}render();return;}
    const hd=e.target.closest('[data-hidedone]');if(hd){hideDone=!hideDone;try{STORE.setItem('planas.focus.hidedone',hideDone?'1':'0');}catch(e2){}render();return;}
    const ot=e.target.closest('[data-opentopic]');if(ot){const id=ot.dataset.opentopic;
      if(window.PLANAS_OPEN_TOPIC){window.PLANAS_OPEN_TOPIC(id);}
      else{const t=TOPICS[id];if(t&&t.page)window.open(t.page,'_blank','noopener');}
      return;}
    const dt=e.target.closest('.dltog');if(dt){dlOpen=!dlOpen;renderDeadlines();return;}
    const cs=e.target.closest('[data-calc]');if(cs&&window.Board&&Board.playCalc){Board.playCalc(cs,e.target);return;}
    const tg=e.target.closest('[data-toggle]');if(tg&&!e.target.closest('.judge')&&!e.target.closest('.a a')&&!e.target.closest('details')){tg.classList.toggle('open');mountIn(tg);return;}
  });
  document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='Enter'&&e.target.matches('.item[data-toggle]')){e.target.classList.toggle('open');mountIn(e.target);return;}});

  // ---------- boot: merge remote progress, then render ----------
  (async function(){
    if(window.PLANAS_STORE){
      try{
        const remote=await window.PLANAS_STORE.load();
        if(remote)P=mergeAll(P,remote);
        keepLocal();
      }catch(e){}
      if(window.PLANAS_STORE.onRemote){
        window.PLANAS_STORE.onRemote(function(remote){P=mergeAll(P,remote);keepLocal();render();});
      }
    }
    render();
    try{let mq=0;const obs=new MutationObserver(()=>{if(!mq)mq=requestAnimationFrame(()=>{mq=0;mountMistakes();});});const n=document.getElementById('testcard');if(n)obs.observe(n,{childList:true,subtree:true});}catch(e){}
    mountMistakes();
  })();
}

if(EMBED!==null){
  boot(EMBED);
} else {
  window.PLANAS_START=function(data){boot(data);};
}
})();
</script>

      });
    });
    document.body.appendChild(btn);
    return btn;
  }

  // ---------------------------------------------------------------------------------------------------- main ----

  function unlockWith(keyJson, kEnc) {
    return aesDecrypt(kEnc, keyJson.check, "key.json").then(function (bytes) {
      if (td(bytes) !== "planas-ok") throw new Error("bad password");
    });
  }

  function start(keyJson, kEnc, kMac, ephemeral) {
    // Pinned: when the password was NOT remembered on this device, window.PLANAS_EPHEMERAL is set before
    // PLANAS_START runs and the page's local copy lives in sessionStorage (gone once the tab closes) instead of
    // localStorage; when it WAS remembered (auto-unlock from IndexedDB, or the box was just ticked), localStorage.
    var storageArea = ephemeral ? window.sessionStorage : window.localStorage;
    return fetchJSON("data.json").then(function (payload) {
      return aesDecrypt(kEnc, payload, "data.json");
    }).then(function (bytes) {
      var data = JSON.parse(td(bytes));

      window.PLANAS_OPEN_TOPIC = function (topicId) {
        hmacHex(kMac, "topic:" + topicId).then(function (hex) {
          var name = hex.slice(0, 16) + ".json";
          var path = "t/" + name;
          return fetchJSON(path).then(function (payload) { return aesDecrypt(kEnc, payload, path); });
        }).then(function (bytes) {
          var html = td(bytes);
          var url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
          window.open(url, "_blank");
          setTimeout(function () { URL.revokeObjectURL(url); }, TOPIC_BLOB_TTL_MS);
        }).catch(function () { /* a topic page failing to open never breaks the rest of the page */ });
      };

      var syncUrl = (data.sync && data.sync.url) || "";
      var storePromise = syncUrl
        ? Promise.all([hmacHex(kMac, "space"), hmacHex(kMac, "token")])
        : Promise.resolve(["", ""]);

      return storePromise.then(function (pair) {
        var space = pair[0].slice(0, 32), token = pair[1];
        var rawStore = window.PlanasSync.createStore({
          url: syncUrl, space: space, token: token,
          encrypt: function (obj) { return aesEncrypt(kEnc, te(JSON.stringify(obj)), "sync:" + space); },
          decrypt: function (payload) { return aesDecrypt(kEnc, payload, "sync:" + space).then(function (b) { return JSON.parse(td(b)); }); },
          merge: mergeProgress,
          fetch: window.fetch.bind(window),
          setTimeout: window.setTimeout.bind(window),
          storage: storageArea
        });

        window.PLANAS_STORE = {
          load: function () {
            return rawStore.load().catch(function () { return null; }).then(function (remote) {
              var local = null;
              try { var raw = storageArea.getItem(LS_KEY); local = raw ? JSON.parse(raw) : null; } catch (e) { local = null; }
              var base = remote || local || { v: 1, done: {}, rec: {}, targets: {}, updatedAt: 0 };
              return mergeProgress(data.seed || {}, base);
            });
          },
          save: rawStore.save,
          onRemote: rawStore.onRemote,
          flush: rawStore.flush,
          status: rawStore.status
        };

        window.PLANAS_EPHEMERAL = !!ephemeral;
        if (typeof window.PLANAS_START === "function") window.PLANAS_START(data.focus);
      });
    });
  }

  function boot() {
    fetchJSON("key.json").then(function (keyJson) {
      var saltBytes = b64ToBytes(keyJson.salt);

      function tryRemembered() {
        return idbGet(keyJson.salt).then(function (rec) {
          if (!rec) return false;
          return unlockWith(keyJson, rec.kEnc).then(function () {
            return start(keyJson, rec.kEnc, rec.kMac, false).then(function () { return true; });
          }).catch(function () {
            return idbDelete(keyJson.salt).then(function () { return false; });
          });
        });
      }

      tryRemembered().then(function (ok) {
        if (ok) return;
        var wrap = buildLockScreen();
        var form = document.getElementById("planas-lock-form");
        var pwField = document.getElementById("planas-lock-pw");
        var msg = document.getElementById("planas-lock-msg");
        var rememberBox = document.getElementById("planas-lock-remember");

        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          msg.textContent = "";
          var password = pwField.value;
          deriveKeys(password, saltBytes).then(function (keys) {
            return unlockWith(keyJson, keys.kEnc).then(function () {
              var remember = !!rememberBox.checked;
              var afterRemember = remember ? idbPut(keyJson.salt, { kEnc: keys.kEnc, kMac: keys.kMac }) : Promise.resolve();
              return afterRemember.then(function () {
                return start(keyJson, keys.kEnc, keys.kMac, !remember);
              });
            }).then(function () {
              removeLockScreen(wrap);
            });
          }).catch(function () {
            msg.textContent = "Neteisingas slaptazodis";
            pwField.value = "";
            var btn = document.getElementById("planas-lock-btn");
            btn.disabled = true;
            setTimeout(function () { btn.disabled = false; }, 1000);
          });
        });
      });
    }).catch(function () {
      // key.json unreachable (offline first load): nothing to unlock yet, leave the page hidden behind no screen
      // beyond what focus.template.html itself shows while waiting for PLANAS_START.
    });

    buildLockButton();
  }

  // Node (test_site.py's `node -e` test, via `require()`) has no `document`: skip the DOM boot in that case
  // instead of throwing, so the pure `lockCleanupPlan` export below can still be required and tested on its own.
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  }

  // Test-only export (browsers never define `module`; this file stays a plain inline <script>, never a module).
  if (typeof module !== "undefined" && module.exports) {
    module.exports = { lockCleanupPlan: lockCleanupPlan, isPendingSyncKey: isPendingSyncKey };
  }
})();

</script>
